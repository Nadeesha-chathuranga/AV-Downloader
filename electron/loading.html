<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
    <title>AV Downloader</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #0a0a0f;
        color: #f5f5f7;
        font-family: "Segoe UI", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        user-select: none;
        overflow: hidden;
      }
      .logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: linear-gradient(135deg, #ff6b6b 0%, #ff9f43 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 12px 40px rgba(255, 107, 107, 0.25);
      }
      .logo span {
        font-size: 40px;
        font-weight: 900;
        letter-spacing: -2px;
        color: #0a0a0f;
      }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 8px; }
      .spinner {
        width: 22px;
        height: 22px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #ff9f43;
        border-radius: 50%;
        margin-top: 22px;
        animation: spin 0.9s linear infinite;
        opacity: 0.9;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
        color: #8b8b93;
        min-height: 18px;
      }
      #status.error { color: #ff6b6b; }
      #status.ready { color: #4cd964; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="logo"><span>AV</span></div>
    <h1>AV Downloader</h1>
    <div class="spinner" id="spinner"></div>
    <div id="status">Starting…</div>
    <script src="loading.js"></script>
  </body>
</html>
