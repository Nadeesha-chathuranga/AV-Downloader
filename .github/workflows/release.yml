name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd client && npm ci

      - name: Generate app icon
        run: npm run gen:icon

      - name: Build client
        run: npm run build

      - name: Build & publish installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing — uncomment when a certificate is available:
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Consolidate orphan draft releases
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $headers = @{ "Authorization" = "Bearer $env:GITHUB_TOKEN"; "Accept" = "application/vnd.github+json" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers
          $dups = @($rel | Where-Object { $_.tag_name -eq $tag -and $_.draft })
          if ($dups.Count -le 1) {
            Write-Host "No duplicate drafts for $tag to clean up (found $($dups.Count))."
            exit 0
          }

          # electron-builder may split uploads across several drafts. Keep the
          # draft with the most assets, then merge in any missing primary assets
          # (exe, blockmap, latest.yml) from the local dist/ so nothing is lost.
          $keep = $dups | Sort-Object { $_.assets.Count } -Descending | Select-Object -First 1
          Write-Host "Keeping release $($keep.id) with $($keep.assets.Count) assets."
          $keepNames = @($keep.assets | ForEach-Object { $_.name })

          $files = Get-ChildItem -Path "dist" -File | Where-Object {
            $_.Extension -eq ".exe" -or $_.Name -eq "latest.yml" -or $_.Extension -eq ".blockmap"
          }
          foreach ($f in $files) {
            $remoteName = $f.Name -replace ' ', '-'
            if ($keepNames -contains $remoteName) {
              Write-Host "Asset already present on keeper: $remoteName"
              continue
            }
            Write-Host "Uploading missing primary asset $remoteName to release $($keep.id)..."
            $uri = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($keep.id)/assets?name=$([uri]::EscapeDataString($remoteName))"
            $upload = @{
              Uri = $uri
              Method = "POST"
              Headers = $headers
              ContentType = "application/octet-stream"
              Body = [System.IO.File]::OpenRead($f.FullName)
            }
            try {
              Invoke-RestMethod @upload | Out-Null
            } finally {
              $upload.Body.Dispose()
            }
            $keepNames += $remoteName
          }

          foreach ($d in $dups) {
            if ($d.id -eq $keep.id) { continue }
            Write-Host "Deleting orphan draft $($d.id) ($($d.name), assets=$($d.assets.Count))."
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($d.id)" -Headers $headers
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: av-downloader-win
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error